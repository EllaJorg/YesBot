<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Yesbot</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        font-family: var(--syc-font);
        margin: 0;
        padding: 18px;
        width: 300px;
        background: var(--syc-cream);
        color: var(--syc-text);
      }
      .syc-popup-shell {
        background: var(--syc-surface);
        border-radius: 20px;
        padding: 18px;
        border: 1px solid var(--syc-border);
        box-shadow: var(--syc-shadow);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
        letter-spacing: 0.01em;
        color: var(--syc-text);
      }
      .syc-subtitle {
        font-size: 12px;
        color: var(--syc-text-muted);
        margin: 0 0 18px;
      }
      .syc-settings-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        font-size: 13px;
        border-bottom: 1px solid var(--syc-border);
      }
      .syc-settings-row:last-child {
        padding-bottom: 0;
        border-bottom: none;
      }
      .syc-settings-row label {
        font-weight: 500;
        color: var(--syc-text);
      }
      .syc-settings-row select,
      .syc-settings-row input[type="checkbox"] {
        margin-left: 12px;
      }
      select {
        border-radius: 999px;
        border: 1px solid var(--syc-border);
        padding: 5px 10px;
        background: var(--syc-control-bg);
        font-size: 13px;
        color: var(--syc-text);
      }
      input[type="checkbox"] {
        accent-color: var(--syc-accent);
        width: 18px;
        height: 18px;
      }
      .syc-status {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--syc-surface-strong);
        border: 1px solid var(--syc-border);
        font-size: 12px;
        color: var(--syc-text-muted);
      }
    </style>
  </head>
  <body class="syc-theme" data-syc-theme="light">
    <div class="syc-popup-shell">
      <h1>Yesbot</h1>
      <p class="syc-subtitle">Sycophancy detector for AI chats</p>
      <div class="syc-settings-row">
        <label for="syc-enabled">Extension enabled</label>
        <input type="checkbox" id="syc-enabled" />
      </div>
      <div class="syc-settings-row">
        <label for="syc-theme">Theme</label>
        <select id="syc-theme"></select>
      </div>
      <div class="syc-status" id="syc-status">
        Scores appear as pills below AI responses on supported sites.
      </div>
    </div>
    <script src="energyConfig.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
